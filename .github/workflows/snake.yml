name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: monicadfm
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#1a1a1a&color_dots=#ffe4ef,#ffc4dd,#ff8fc0,#ff4f9a,#d6266f
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff4f9a&color_dots=#1f1a1d,#4a1f33,#8c2f5c,#d63f86,#ff8fc0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
